name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    # ubuntu-latest 已开始迁移到 Ubuntu 26，setup-android v3 在新镜像上会失败
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        continue-on-error: true
        uses: android-actions/setup-android@v3

      - name: Locate Android SDK
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager already on PATH"
            exit 0
          fi
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          for candidate in \
            "$SDK/cmdline-tools/latest/bin" \
            "$SDK/cmdline-tools/bin" \
            "$SDK/tools/bin"; do
            if [ -x "$candidate/sdkmanager" ]; then
              echo "$candidate" >> "$GITHUB_PATH"
              echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
              echo "using $candidate"
              exit 0
            fi
          done
          echo "::error::找不到 Android SDK / sdkmanager"
          exit 1

      - name: Install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" || \
            echo "::warning::指定 SDK 组件不可用，交给 Gradle 自动下载"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          names=(KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD)
          present=0
          missing=()
          for name in "${names[@]}"; do
            if [ -n "${!name:-}" ]; then
              present=$((present + 1))
            else
              missing+=("$name")
            fi
          done

          if [ "$present" -ne 0 ] && [ "$present" -ne 4 ]; then
            echo "::error::签名 Secret 不完整，缺少：${missing[*]}"
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$present" -ne 4 ]; then
              echo "::error::发布 tag 必须配置全部 4 个签名 Secret，缺少：${missing[*]}"
              exit 1
            fi
            echo "release signing: enabled"
          elif [ "$present" -eq 0 ]; then
            echo "release signing: not configured, fall back to debug signing"
          else
            echo "release signing: enabled"
          fi

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"; then
              echo "::error::KEYSTORE_BASE64 不是有效的 Base64，请重新复制完整内容"
              exit 1
            fi
            if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
              echo "::error::Base64 解码后为空，请检查 KEYSTORE_BASE64"
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
                -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
              echo "::error::keystore 无法用 KEYSTORE_PASSWORD 打开，请检查密码与 Base64 是否来自同一个文件"
              exit 1
            fi
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "keystore ready"
          else
            echo "no keystore secret, using debug signing"
          fi

      - name: Check tag matches versionName
        if: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          VERSION="$(./gradlew -q :app:printVersionName | tail -n 1 | tr -d '[:space:]')"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' 与 versionName '$VERSION' 不一致，应为 v$VERSION"
            exit 1
          fi
          echo "tag ok: $GITHUB_REF_NAME"

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:test --no-daemon

      - name: Build release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(find "$SDK/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner"
            exit 1
          fi

          for APK in app/build/outputs/apk/release/*.apk; do
            echo "== $APK"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          done

      - name: Write APK checksum
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > apk-sha256.txt
          cat apk-sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VpnAutoSwitch-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/apk-sha256.txt
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/apk-sha256.txt
          generate_release_notes: true
